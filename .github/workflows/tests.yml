# Runs the offline test suite on every push and pull request.
# No secrets are needed: tests/conftest.py disables .env, replaces DATABASE_URL
# with an address that cannot connect, removes the API key and blocks sockets.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
