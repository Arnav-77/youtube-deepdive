# Golden set for DeepDive retrieval evaluation.
#
# WHAT THIS IS
#   Hand-written relevance labels: for each question, the place in the video
#   where the answer actually is. Everything Phase 03 measures (Recall@k, MRR,
#   citation offset) is measured against these spans. Nothing else in this
#   project can be used to produce them: labels generated by our own retrieval
#   would grade retrieval against itself.
#
# WHY TIMESTAMP SPANS, NOT CHUNK IDS
#   A chunk id belongs to one chunking run. fixed_1000_200 and topicshift_v1
#   produce different chunks with different ids, so a label naming chunk 7
#   cannot score the other strategy at all. Seconds belong to the video, so one
#   label scores every strategy: a retrieved chunk counts as relevant when its
#   time range overlaps the gold span.
#
# THE SPLIT
#   set: dev      -- 5 videos. ALL tuning happens here: chunking thresholds,
#                    prompt wording, retrieval parameters.
#   set: reported -- 20 videos. Evaluated only. Never tuned against, or the
#                    reported numbers are optimistic by an unknowable amount.
#   Assigned when the video is added and never changed afterwards.
#
# NO TRANSCRIPT TEXT IN THIS FILE
#   The repo is public and transcripts are the creators' content. Ids and
#   timestamps only. `quote` is a short reminder for the labeller, not data.
#
# FIELDS
#   video_id      YouTube id, 11 chars, case sensitive.
#   set           dev | reported
#   duration_s    video length in seconds, for the length-mix audit.
#   category      educational | technical | interview | rambling | jargon |
#                 contradiction | no_answer
#   questions:
#     q           the question, as a user would type it.
#     spans       one or more [start, end] in seconds. More than one when the
#                 answer is genuinely in several places. Empty list [] means
#                 the answer is NOT in this video and the correct behaviour is
#                 to refuse.
#     quote       a few words from the passage, so a future reader can check
#                 the span without rewatching. Keep it short.
#     note        optional: why this question is here, what makes it hard.

videos:
  - video_id: LXaFHI_2Hus
    set: dev
    duration_s: 1030
    category: educational
    questions:
      - q: What did the speaker learn from the person who climbed Everest?
        spans: [[51, 128]]
        quote: asked him what he remembered
        note: Verified by ear at t=51 during Phase 02. Retrieves well.
      - q: how to be consistent
        spans: [[480, 610]]
        quote: write down every day
        note: >
          Asked by the first real user, 21 Sep 2026, query_logs row 5. Returned
          no_chunks_retrieved. Measured cause: the speaker never says any form
          of "consistent" (ILIKE '%consist%' matches 0 of 20 chunks), so
          lexical retrieval has nothing to match. The answer IS in the
          video, in other words: 8:00-8:30 he says to write things down every
          day and break them into smaller pieces, and 8:32-10:10 he covers
          managing energy so you keep going. Labelled by watching, 28 Sep 2026.
          This is a RETRIEVAL failure, not a refusal case, and the clearest
          argument for dense retrieval in the set.
