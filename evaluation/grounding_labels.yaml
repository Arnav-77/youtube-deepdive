    question: "What did the speaker learn from the person who climbed Everest?"
    video_id: "LXaFHI_2Hus"
    model: "gemini-3.6-flash"
    refused: false
    segments:
      - index: 0
        cited: [1]
        hash: "b60f4e6fe70d"
        label: supported
        note:
      - index: 1
        cited: [1]
        hash: "656ae9dd7c19"
        label: supported
        note:
      - index: 2
        cited: [1]
        hash: "785f03825dfa"
        label: supported
        note:
